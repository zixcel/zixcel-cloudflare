[package]
name = "zixcel-cloudflare-observer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-cloudflare"
description = "Bounded read-only Cloudflare lifecycle and DNS evidence"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crowsi-provider-read-http = { git = "https://github.com/crowsi-net/crowsi-transport-foundation", rev = "8daf36688e1618f294274c61ebfe607f77639534" }
zeroize = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
