[package]
name = "zixcel-cloudflare-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-cloudflare"
description = "Reviewed native cloudflare observations through the zix protocol"
publish = false
[[bin]]
name = "zix-cloudflare"
path = "src/main.rs"
[dependencies]
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "c2ee2e9670efe81473bf7067a8efa1944589619e" }
zixcel-cloudflare-observer = { path = "../cloudflare-observer" }
serde_json = "1"
zeroize = "1"
[dev-dependencies]
serde_json = "1.0"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
